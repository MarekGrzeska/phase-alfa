# Jedno wejście do wszystkich pętli — Windows, macOS i CI wołają to samo.
#
# go-task ma wbudowany interpreter POSIX sh (mvdan/sh), więc `&&`, `||`,
# potoki i podstawienia działają na Windows BEZ instalowania bash-a.
# Ale interpreter nie dostarcza coreutils: `rm`, `cp`, `mkdir -p` na Windows
# NIE ISTNIEJĄ. Stąd reguła: zero operacji na plikach w tym pliku —
# sprzątanie robią narzędzia, które to potrafią same.

version: '3'

dotenv: ['.env']

vars:
  PY: uv run python

tasks:
  default:
    cmds: [task --list]
    silent: true

  # ---------------------------------------------------------------- środowisko
  setup:
    desc: Sprawdza, czy maszyna ma komplet narzędzi
    silent: true
    # Wartości w apostrofach: bez nich YAML łamie się na dwukropku w "BRAK: ..."
    cmds:
      - cmd: 'docker --version > /dev/null || (echo "BRAK: Docker" && exit 1)'
      - cmd: 'uv --version > /dev/null || (echo "BRAK: uv — https://docs.astral.sh/uv/" && exit 1)'
      - cmd: 'test -f .env || (echo "BRAK: .env — skopiuj z .env.example" && exit 1)'
      # `cd backend`, bo `global.json` lezy TAM, a nie w korzeniu. Wolane z korzenia
      # `dotnet --version` przechodzilo z dowolnym zainstalowanym SDK — a wlasny
      # komunikat mowil, ze sprawdza wersje z backend/global.json. Sprawdzenie,
      # ktore nie sprawdza, przenosi diagnoze o pol godziny do przodu: setup mowil
      # KOMPLET, a `task test:dotnet` wywalal sie na „compatible .NET SDK not found".
      - cmd: '(cd backend && dotnet --version) > /dev/null || (echo "BRAK: .NET SDK w wersji z backend/global.json" && exit 1)'
      - cmd: 'node --version > /dev/null || (echo "BRAK: Node.js" && exit 1)'
      - cmd: 'pnpm --version > /dev/null || (echo "BRAK: pnpm — corepack enable pnpm" && exit 1)'
      - cmd: 'echo "OS={{OS}} ARCH={{ARCH}} — komplet dla G1.1-G1.4."'

  # ------------------------------------------------------------------ baza
  up:
    desc: Postgres + Azurite (emulator Azure Blob) + migracje schematu
    cmds:
      - docker compose up -d --wait
      - task: migrate

  down:
    desc: Zatrzymuje Postgresa i Azurite (dane zostają)
    cmds: [docker compose down]

  # Moduły, nie ścieżki do plików: korzeniem pakietu jest ingest/, więc
  # `pdf.layout`, `parsers.omap_e8.parser` i `schema.migrate` widzą się nawzajem.
  # Uruchomienie przez ścieżkę ustawiłoby sys.path na katalog pliku i importy
  # między pakietami by się posypały.
  migrate:
    desc: Stosuje brakujące migracje schematu
    dir: ingest
    cmds: ['{{.PY}} -m schema.migrate']

  migrate:status:
    desc: Pokazuje, które migracje weszły
    dir: ingest
    cmds: ['{{.PY}} -m schema.migrate --status']

  # `docker compose down -v` kasuje WSZYSTKIE wolumeny projektu, wiec od dolozenia
  # Azurite takze `klucz-blobdata`. Pytanie ma wymieniac wszystko, co znika —
  # prompt mowiacy o samym korpusie uczy nieprawdziwego modelu tego, co robi
  # polecenie. Od G2.4 dojdzie asymetria: reset czysci baze, ale zostawia pliki PNG
  # w `data/blob` (tam pisze DiskBlobStore) — dolozyc wtedy czyszczenie narzedziem,
  # nie `rm` w tym pliku.
  db:reset:
    desc: 'Baza od zera (UWAGA: kasuje wolumeny — korpus ORAZ dane Azurite)'
    prompt: Skasować wolumeny (korpus w Postgresie ORAZ dane emulatora blobów) i postawić wszystko od nowa?
    cmds:
      - docker compose down -v
      - task: up

  db:psql:
    desc: Konsola SQL w kontenerze
    interactive: true
    cmds: [docker compose exec db psql -U klucz -d klucz]

  # ------------------------------------------------------------------ testy
  test:
    desc: Wszystkie testy deterministyczne
    cmds:
      - task: test:python
      - task: test:dotnet
      - task: test:web
      - task: test:contract

  test:python:
    desc: ruff + pytest
    dir: ingest
    cmds:
      - uv run ruff check .
      - uv run pytest -q

  # Zadania poniżej dostaną treść w G1.3 i G1.4. Do tego czasu MÓWIĄ, że nic
  # nie sprawdzają — stub kończący się cicho zerem jest nieodróżnialny
  # od testu, który przechodzi.
  #
  # Rozdzielenie przez `if`, a NIE przez `polecenie || echo`: `||` nie odróżnia
  # „nie ma pliku" od „testy się wywaliły" i połyka jedno i drugie. Od G1.3
  # czerwony test .NET wypisywałby wtedy POMIJAM i kończył się sukcesem.
  test:dotnet:
    desc: Build + testy architektury i zachowania
    cmds:
      - cmd: |
          if test -f backend/Klucz.sln; then
            dotnet test backend/Klucz.sln
          else
            echo "POMIJAM test:dotnet — brak solution (wchodzi w G1.3)"
          fi

  # Typecheck JEST tu testem zero-DOM: `packages/core` kompiluje się bez `lib: DOM`,
  # więc `document` w tym pakiecie nie przechodzi przez `tsc`. Vitest dokłada dwie
  # pozostałe warstwy — zabronione zależności i skan źródeł.
  #
  # `build` jest trzecim krokiem, bo emisja deklaracji (`declaration: true`) potrafi
  # paść tam, gdzie `--noEmit` przechodzi — CI widziało wtedy błąd, a lokalnie nie.
  test:web:
    desc: Typecheck (w tym zero-DOM) + vitest + build
    cmds:
      - cmd: |
          if test -f web/pnpm-workspace.yaml; then
            pnpm -C web -r typecheck
            pnpm -C web -r test
            pnpm -C web -r build
          else
            echo "POMIJAM test:web — brak workspace weba"
          fi

  test:contract:
    desc: Dryf OpenAPI — regeneracja i porównanie z repo (G1.3.2)
    cmds:
      - cmd: |
          if test -f backend/artifacts/openapi.json; then
            task openapi:check
          else
            echo "POMIJAM test:contract — brak OpenAPI (wchodzi w G1.3.2)"
          fi

  # --------------------------------------------------------------- kontrakt
  openapi:generate:
    desc: Dokument OpenAPI z API + typy klienta TS
    cmds:
      # Dokument powstaje przy buildzie (Microsoft.Extensions.ApiDescription.Server),
      # więc build JEST generacją — nie ma drugiej ścieżki, która mogłaby się rozjechać.
      #
      # `--no-incremental`, bo MSBuild jest przyrostowy: gdy projekt jest aktualny,
      # POMIJA cel generujący dokument. Bramka dryfu porównywała wtedy plik, którego
      # nikt w tym przebiegu nie odtworzył — czyli sam ze sobą — i zawsze widziała
      # zgodność. Wystarczyło, żeby artefakt wrócił do starszej wersji bez zmiany kodu
      # (`git checkout --`, zła strona przy rozwiązywaniu konfliktu, `git stash`),
      # a bramka mówiła „kontrakt się zgadza" o starym kontrakcie.
      - dotnet build backend/src/Klucz.Api/Klucz.Api.csproj --no-incremental
      # Asercja istnienia, bo „nie wygenerowano" wygląda dokładnie tak samo jak
      # „nie ma zmian": skasowany artefakt też dawał build zakończony sukcesem.
      - cmd: 'test -f backend/artifacts/openapi.json || (echo "BRAK ARTEFAKTU: build nie wygenerowal backend/artifacts/openapi.json" && exit 1)'
      - pnpm -C web --filter @klucz/api-client run generate
      - cmd: 'test -f web/packages/api-client/src/schema.d.ts || (echo "BRAK ARTEFAKTU: generator nie wygenerowal web/packages/api-client/src/schema.d.ts" && exit 1)'

  openapi:check:
    desc: Bramka dryfu — kontrakt w repo musi się zgadzać z kodem
    cmds:
      - task: openapi:generate
      # Zmieniłeś API i nie przegenerowałeś klienta → czerwony build. O to chodzi.
      - cmd: |
          # Najpierw: czy oba pliki w ogóle są w repo. `git diff` milczy o plikach
          # nieśledzonych, więc bez tego bramka przepuszczałaby wariant „wygenerowane,
          # ale nigdy nie zacommitowane" — czyli dokładnie ten, który psuje diff PR-a.
          git ls-files --error-unmatch backend/artifacts/openapi.json web/packages/api-client/src/schema.d.ts > /dev/null || (echo "KONTRAKT POZA REPO: openapi.json albo schema.d.ts nie sa sledzone przez gita." && exit 1)
          git diff --exit-code -- backend/artifacts/openapi.json web/packages/api-client/src/schema.d.ts || (echo "DRYF KONTRAKTU: openapi.json albo schema.d.ts rozjechaly sie z kodem. Zacommituj wynik: task openapi:generate" && exit 1)

  # ------------------------------------------------------------- development
  # Port API bierze sie z `API_PORT` w `.env` — tak samo jak DB_PORT i BLOB_PORT.
  # Stal wczesniej na sztywno w trzech plikach WERSJONOWANYCH naraz
  # (launchSettings.json, echo ponizej, backend/README.md), wiec deweloper
  # z zajetym 5014 nie mial gdzie go zmienic bez edycji repozytorium.
  # `launchSettings.json` nie ma juz `applicationUrl`: wygrywalo ono nawet
  # z jawnym ASPNETCORE_URLS, wiec zadne ustawienie ze srodowiska nie dzialalo.
  #
  # `WEB_PORT` poszedl ta sama droga: stal na sztywno w echo ponizej, a Vite przy
  # zajetym porcie po cichu wstaje na nastepnym. Stad `strictPort` w vite.config.ts.
  dev:
    desc: API + web z hot-reloadem
    cmds:
      - task: up
      - cmd: 'echo "API: http://localhost:${API_PORT:-5014} · web: http://localhost:${WEB_PORT:-5173} (proxy /api → API)"'
      - task: dev:watch

  # Oba serwery stoją, dopóki ich nie ubijesz, więc muszą działać RÓWNOLEGLE.
  # `deps` w go-task są równoległe, `cmds` — po kolei: w `cmds` vite nie wystartowałby
  # nigdy, bo `dotnet watch` nie kończy się sam.
  dev:watch:
    internal: true
    deps: [dev:api, dev:web]

  dev:api:
    internal: true
    cmds:
      - dotnet watch --project backend/src/Klucz.Api run --urls "http://localhost:${API_PORT:-5014}"

  dev:web:
    internal: true
    cmds:
      - pnpm -C web --filter @klucz/web dev

  # ------------------------------------------------------------ dalsze fazy
  mirror:
    desc: Zwózka korpusu CKE — idempotentna, dosypuje tylko brakujące
    dir: ingest
    cmds: ['{{.PY}} -m mirror.cke_mirror {{.CLI_ARGS}}']

  ingest:
    desc: Parser kluczy OMAP E8 → korpus w Postgresie
    dir: ingest
    cmds: ['{{.PY}} -m parsers.omap_e8.run {{.CLI_ARGS}}']

  # Regresja parsera BEZ bazy (G2.3.1, krok 3). Poprawka dla rocznika 2019 nie ma
  # prawa ruszyć liczb 2020–2026, a zrzut łapie to w dwie minuty — w ekranie
  # korekty ta sama regresja kosztuje dzień.
  #
  #   task parser:snapshot -- --out ../data/reports/parser-przed.json
  #   task parser:snapshot -- --baseline ../data/reports/parser-przed.json
  parser:snapshot:
    desc: Zrzut liczb parsera i porównanie z poprzednim przebiegiem
    dir: ingest
    cmds: ['{{.PY}} -m parsers.omap_e8.snapshot {{.CLI_ARGS}}']

  # ------------------------------------------------------------------ korekta
  # `--host 127.0.0.1` jawnie, mimo że to domyślna wartość uvicorna: ekran
  # edytuje korpus bez żadnego uwierzytelnienia, więc „tylko localhost" jest
  # tu decyzją, a nie przypadkiem konfiguracji, którą wolno cicho zmienić.
  correction:
    desc: Ekran korekty na localhoście (G2.1)
    dir: ingest
    cmds:
      - cmd: 'echo "Ekran korekty: http://localhost:${CORRECTION_PORT:-8600}"'
      - '{{.PY}} -m uvicorn correction.app:app --host 127.0.0.1 --port ${CORRECTION_PORT:-8600} --reload'

  correction:report:
    desc: Raport korekty (S6, S7, S8) — stan, czasy, prognoza — do data/reports/
    dir: ingest
    cmds: ['{{.PY}} -m correction.report {{.CLI_ARGS}}']

  # ------------------------------------------------------------ wycinki i dane
  # `task db:reset` kasuje wolumen Postgresa, ale ZOSTAWIA pliki PNG w data/blob.
  # Sprzątaniem zajmuje się narzędzie, nie `rm` w tym pliku — na Windows go nie ma.
  #   task crops                    # dotnij brakujące wycinki
  #   task crops -- --prune         # POKAŻ osierocone wycinki (nic nie kasuje)
  #   task crops -- --prune --yes   # skasuj to, co wypisała linijka wyżej
  crops:
    desc: Wycinki PNG zasobów graficznych — dotnij brakujące, posprzątaj osierocone
    dir: ingest
    cmds: ['{{.PY}} -m parsers.omap_e8.crops {{.CLI_ARGS}}']

  mathjson:
    desc: Konwersja zapisów równoważnych na MathJSON (G2.6)
    dir: ingest
    cmds: ['{{.PY}} -m mathjson.fill {{.CLI_ARGS}}']

  mathjson:setup:
    desc: Zależności konwertera MathJSON (jedyna — @cortex-js/compute-engine)
    cmds: [pnpm -C ingest/mathjson install --ignore-workspace]

  # --------------------------------------------------------------- LLM (G2.5)
  # Wywołań modelu NIE MA w CI: testy chodzą na utrwalonych odpowiedziach,
  # a te dwa polecenia uruchamia się ręcznie i płaci się za nie z budżetu
  # badawczego alfy. Klucz stoi w .env (OPENAI_API_KEY albo ANTHROPIC_API_KEY —
  # zależnie od `--model dostawca:nazwa`), nigdy w repozytorium.
  prefill:
    desc: Podpowiedzi LLM do ekranu korekty — próbka pomiaru S6
    dir: ingest
    cmds: ['{{.PY}} -m correction.prefill {{.CLI_ARGS}}']

  # Plan A2-auto: model porównuje rekord ze stroną klucza i rozstrzyga.
  #   task verify -- --year 2025 --variant 100            # sam raport, bez zapisu
  #   task verify -- --year 2025 --variant 100 --apply    # rozstrzyga w bazie
  verify:
    desc: Drugi czytelnik LLM — rozstrzyga rekordy w zakresie; bez --apply tylko raport
    dir: ingest
    cmds: ['{{.PY}} -m correction.verify {{.CLI_ARGS}}']

  # Plan A2-auto, X3: ramka rysunku z siatki przez model, dla zasobów „cała strona".
  frame:
    desc: Ramki rysunków z siatki przez LLM — zamiast ręcznego „Wytnij"; bez --apply tylko raport
    dir: ingest
    cmds: ['{{.PY}} -m correction.frame {{.CLI_ARGS}}']

  describe:
    desc: Opisy rysunków (alt-text) dla wycinków — pomiar S7
    dir: ingest
    cmds: ['{{.PY}} -m correction.describe {{.CLI_ARGS}}']

  corpus:report:
    desc: Raport kompletności korpusu — domknięcie A2 (G2.7)
    dir: ingest
    cmds: ['{{.PY}} -m reports.corpus {{.CLI_ARGS}}']

  bench:
    desc: Benchmark golden setu (A3)
    cmds:
      - cmd: 'echo "bench wchodzi w A3 (G3.3)."'
