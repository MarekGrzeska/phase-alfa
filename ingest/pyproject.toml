[project]
name = "klucz-ingest"
version = "0.1.0"
description = "Offline ETL: PDF-y CKE -> rekordy w PostgreSQL. Nie obsluguje ruchu uzytkownika."
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    # G1.2 dolozy: pdfplumber (MIT), pypdf (BSD), cryptography
    # (jeden klucz w korpusie jest zaszyfrowany AES z pustym haslem wlasciciela)
    "pypdf>=5",
    # --- G2.1: ekran korekty ---
    # Licencje sprawdzone 25.08.2026, wszystkie permisywne: fastapi/starlette (MIT),
    # uvicorn (BSD-3), jinja2 (BSD-3), python-multipart (Apache-2.0),
    # pypdfium2 (Apache-2.0/BSD-3), pillow (MIT-CMU).
    #
    # pypdfium2, a NIE PyMuPDF: AGPL-3.0 uruchamia obowiazek udostepnienia zrodel
    # w modelu SaaS (DECYZJE.md, sekcja 1). Render strony to jedyne, czego ekran
    # potrzebuje, wiec nie ma powodu wpuszczac tu tej licencji.
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pillow>=10",
    "pypdfium2>=4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    # --- G2.5: LLM w ingescie ---
    # Klucz WYLACZNIE z .env (wzor w .env.example), nigdy w repozytorium.
    # Wywolan modelu NIE MA w CI: testy chodza na utrwalonych odpowiedziach,
    # przebieg z zywym modelem jest reczny.
    #
    # `pydantic` jawnie, choc wchodzi tranzytywnie z fastapi: schematy
    # structured output sa naszym kontraktem z modelem, wiec zaleznosc
    # ma byc zadeklarowana tam, gdzie jest uzywana.
    "anthropic>=1",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    # TestClient Starlette stoi na kliencie HTTP — bez tego testy ekranu nie maja
    # czym wolac aplikacji. httpx2, bo starlette 1.x zglasza uzycie httpx 0.x jako
    # przestarzale, a ostrzezenie w logu CI jest dlugiem, nie tlem.
    "httpx2>=2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# S  = reguly bezpieczenstwa (bandit) - zeby wyciszenia `# noqa: S...` cokolwiek znaczyly
# RUF100 = wylapuje MARTWE wyciszenia, czyli takie dla regul, ktorych nie ma w tej liscie
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

# RUF001/002/003 zglaszaja "znak dwuznaczny" dla polskich liter i symboli
# matematycznych. Ten korpus jest po polsku i pelen minusow typograficznych,
# kropek mnozenia i cudzyslowow drukarskich - regula ma tu 100% falszywych
# trafien, wiec jest wylaczona globalnie, a nie wyciszana linia po linii.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# W testach asercje sa cala trescia (S101), haslo do bazy deweloperskiej stoi
# jawnie w docker-compose.yml, wiec nie jest sekretem (S105/S106), a subprocess
# uruchamia NASZ wlasny runner przez sys.executable, nie dane z zewnatrz (S603).
# S607: testy wolaja `node` po nazwie, tak samo jak pnpm i generator
# klienta OpenAPI — repozytorium wymaga go w PATH (`task setup`).
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]

# --- kod awansowany z research/ (G1.2) ---
# Te trzy moduly przeszly z research/ BEZ ZMIAN LOGIKI i taka byla teza
# przeprowadzki: liczby z sondy (1436 zadan, pokrycie 100/100/100) sa jedynym
# sposobem, zeby sprawdzic, ze nic sie po drodze nie zepsulo, i dzialaja tylko
# wtedy, gdy nikt niczego "przy okazji nie poprawil".
#
# Wyciszone sa WYLACZNIE reguly stylu: stara skladnia typow (UP), formatowanie
# przez %, nazwy jednoliterowe. Reguly, ktore lapia BLEDY - F, B (poza B905),
# S poza wyjatkami nizej - zostaja wlaczone i wlasnie zlapaly prawdziwa
# regresje (brak `import sys` po usunieciu hacka na sys.path).
#
# Sprzatanie stylu to osobny commit, po G1.2.
"pdf/*.py" = ["UP", "E741", "B905", "RUF007"]
"parsers/omap_e8/parser.py" = ["UP", "E741", "B905", "E501"]
"parsers/omap_e8/run.py" = ["UP031", "UP006", "UP045"]
# Mirror pobiera pliki z cke.gov.pl po https, a adresy bierze z indeksu tej
# samej witryny - S310 ostrzega przed schematem file:/custom, ktorego tu nie ma.
"mirror/cke_mirror.py" = ["UP", "S310", "B904", "E741", "B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# korzeniem pakietu jest ingest/ - stad importy `schema.migrate`, `pdf.layout`,
# `parsers.omap_e8.parser`; sposob skladania adresu bazy w JEDNYM miejscu
pythonpath = ["."]
markers = [
    "integracyjny: wymaga dzialajacej bazy (DATABASE_URL albo DB_* w srodowisku)",
    "mirror: wymaga pobranego mirrora CKE (MIRROR_ROOT)",
]
