<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ekran korekty{% endblock %} · Klucz</title>
<style>
/* Tyle stylu, ile trzeba, żeby dało się czytać kryteria obok skanu strony.
   Reguła stopu z Planu Implementacji: widok jest zrobiony, gdy odpowiada
   na pytanie, dla którego powstał. */
:root {
  --ground: #f6f7f7; --surface: #fff; --ink: #16201f; --ink-2: #55625f;
  --rule: #d7dedc; --accent: #0e5b4f; --warn: #96620c; --crit: #9e2e2e;
  --ok: #2c7355;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0e1514; --surface: #16201f; --ink: #e4ebe9; --ink-2: #a0aeab;
    --rule: #2b3937; --accent: #55c4ac; --warn: #d9a44c; --crit: #e07a7a;
    --ok: #63c193;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--accent); }
header {
  display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap;
  padding: .8rem 1.2rem; border-bottom: 1px solid var(--rule);
  background: var(--surface); position: sticky; top: 0; z-index: 5;
}
header h1 { font-size: 1rem; margin: 0; letter-spacing: -.01em; }
header .spacer { flex: 1; }
main { padding: 1.2rem; }
.card {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 4px; padding: 1rem; margin-bottom: 1rem;
}
h2 { font-size: .95rem; margin: 0 0 .6rem; }
h3 { font-size: .85rem; margin: 0 0 .4rem; color: var(--ink-2); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--rule); }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
input, select, textarea, button {
  font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--rule); border-radius: 3px; padding: .3rem .4rem;
}
textarea { width: 100%; resize: vertical; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
button.danger { border-color: var(--crit); color: var(--crit); }
.small { font-size: .8rem; color: var(--ink-2); }
.mono { font-family: ui-monospace, Consolas, monospace; }
.tag {
  display: inline-block; font-size: .7rem; padding: .1rem .35rem; border-radius: 3px;
  border: 1px solid var(--rule); white-space: nowrap;
}
.tag.pending { color: var(--warn); border-color: var(--warn); }
.tag.approved { color: var(--ok); border-color: var(--ok); }
.tag.corrected { color: var(--accent); border-color: var(--accent); }
.tag.rejected { color: var(--crit); border-color: var(--crit); }
.errors {
  border: 1px solid var(--crit); border-left-width: 3px; color: var(--crit);
  padding: .6rem .9rem; margin-bottom: 1rem; background: var(--surface);
}
.errors ul { margin: .3rem 0 0; padding-left: 1.1rem; }
.metrics { display: flex; gap: 1.6rem; flex-wrap: wrap; }
.metric b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.metric span { font-size: .75rem; color: var(--ink-2); }
</style>
</head>
<body>
<header>
  <h1><a href="/{% if scope_query %}?{{ scope_query }}{% endif %}">Ekran korekty</a></h1>
  <span class="small">{% block subtitle %}{% endblock %}</span>
  <span class="spacer"></span>
  {% block actions %}{% endblock %}
</header>
<main>
{% if errors %}
<div class="errors">
  <strong>Nie zapisano — popraw i spróbuj ponownie:</strong>
  <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
</div>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
