# Bramka, która nie zależy od pamięci autora.
#
# Bez bazy i bez mirrora pakiet testów kurczy się z 33 do 14 — dlatego usługa
# Postgresa stoi tu obok kroków: „zielone CI" i „CI, które nic nie uruchomiło"
# mają wyglądać różnie. Liczba pominiętych testów jest wypisywana wprost.
#
# Arkusze CKE NIE wchodzą do repozytorium (G0.1), więc testy oznaczone `mirror`
# pomijają się tutaj świadomie. Regresję rekonstrukcji trzymają zamiast nich
# zrzuty stron w `ingest/tests/fixtures/`.
name: CI

# `push` tylko na `main`, reszta przez `pull_request`. Wczesniej bylo
# `branches: ['**']`, wiec kazdy push do galezi z otwartym PR-em odpalal DWA
# przebiegi po cztery zadania — te same testy, ten sam commit, podwojny rachunek.
# Repozytorium jest prywatne, wiec minuty licza sie do limitu konta (plan G1.5).
on:
  push:
    branches: [main]
  pull_request:

# BEZ `paths-ignore` na `docs/**` — mimo ze zmiana samego przegladu HTML odpala cztery
# zadania (~3,5 minuty). `paths-ignore` sprawia, ze zadanie sie NIE URUCHAMIA, a nie ze
# konczy sukcesem: gdyby kiedys weszly wymagane checki, taki PR utknalby w stanie
# „expected — waiting for status" bez komunikatu prowadzacego do przyczyny. Decyzja
# czeka na rozstrzygniecie sprawy ochrony `main` (plan G1.5, krok 3).

# Kolejny push do galezi ubija poprzedni przebieg tej samej galezi — zadania
# licza sie do limitu, a wynik dla nieaktualnego commita nikogo nie obchodzi.
# Na `main` NIE anulujemy: tam kazdy przebieg opisuje stan, ktory zostaje.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Token tylko do odczytu. Zadne zadanie nie pisze do repozytorium ani nie wystawia
# artefaktow — a domyslne uprawnienia sa szersze, niz ktorekolwiek z nich potrzebuje.
permissions:
  contents: read

jobs:
  # `timeout-minutes` na kazdym zadaniu, bo domyslny limit GitHuba to 360 minut —
  # jeden zwis (`dotnet test`, `docker pull` czekajacy na siec, usluga bazy, ktora
  # nigdy nie zglosi zdrowia) zjadlby 18% miesiecznego limitu konta i nie powiedzial
  # nic, czego nie powiedzialby po dwoch minutach. Zapas jest duzy, bo limit ma lapac
  # ZWIS, a nie wolniejszy dzien: zmierzone czasy to 28s, 41s, 1m02s i 1m06s.
  python:
    name: ruff + pytest + migracje + BOM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: klucz
          POSTGRES_USER: klucz
          POSTGRES_PASSWORD: klucz_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klucz -d klucz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: klucz
      DB_USER: klucz
      DB_PASSWORD: klucz_ci
      PYTHONIOENCODING: utf-8

    steps:
      # `@v5`, nie `@v4`: tamte deklaruja Node 20, ktory GitHub juz uznal za przestarzaly
      # i uruchamia je na Node 24 wbrew deklaracji. Dzis to samo ostrzezenie w logu;
      # w dniu, w ktorym podkladka zniknie, zadania stana na kroku `checkout` — czyli
      # pierwszym, bez zwiazku ze zmiana, ktora akurat bedzie w PR-ze.
      - uses: actions/checkout@v5

      - name: uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--extra dev` bo pytest i ruff stoją w `optional-dependencies.dev`;
      # bez tego CI instalowałoby sam produkt i nie miało czym uruchomić testów.
      - name: Zależności
        working-directory: ingest
        run: uv sync --frozen --extra dev

      - name: Migracje schematu
        working-directory: ingest
        run: uv run python -m schema.migrate

      - name: Lint
        working-directory: ingest
        run: uv run ruff check .

      # `-rs` wypisuje powód każdego pominięcia. Bez tego nie widać różnicy
      # między „testy przeszły" a „testy się nie uruchomiły".
      - name: Testy
        working-directory: ingest
        run: uv run pytest -q -rs

      # Trzy bajty, ktore decyduja, czy skrypt w ogole sie uruchomi: bez BOM-u Windows
      # PowerShell 5.1 czyta plik jako ANSI, polskie napisy sie rozjezdzaja i parser lamie
      # sie na peknietym cudzyslowie. Dotad pilnowal tego wylacznie komentarz w pliku,
      # czyli nic — a repozytorium, ktore zero-DOM pilnuje czterema warstwami, nie ma
      # powodu robic tu wyjatku. Zadanie jest tanie i nie potrzebuje niczego poza powloka.
      - name: BOM w skryptach PowerShella
        run: |
          for script in scripts/*.ps1; do
            head -c 3 "$script" | od -An -tx1 | tr -d ' \n' | grep -qx efbbbf || {
              echo "BRAK BOM: $script — PowerShell 5.1 przeczyta go jako ANSI (CLAUDE.md)"
              exit 1
            }
          done

  dotnet:
    name: build + testy backendu
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Baza stoi także tutaj: bez niej `Zywa_baza_daje_odpowiedz_ok` pomija się,
    # a health check przestaje być czymkolwiek sprawdzonym.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: klucz
          POSTGRES_USER: klucz
          POSTGRES_PASSWORD: klucz_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klucz -d klucz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: klucz
      DB_USER: klucz
      DB_PASSWORD: klucz_ci

    steps:
      - uses: actions/checkout@v5

      # Wersja SDK z `backend/global.json` — CI i maszyna budują tym samym.
      # Cache pakietow trzyma sie `packages.lock.json`: zmiana wersji w
      # `Directory.Packages.props` przelicza lockfile'e, a te sa kluczem cache'u.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      # `--locked-mode`: przywracamy DOKLADNIE to, co stoi w `packages.lock.json`.
      # Pakiet dodany bez zacommitowania lockfile'a konczy sie tu bledem NU1004,
      # a nie cichym pobraniem czegos innego niz na maszynie autora.
      - name: Przywrocenie pakietow
        run: dotnet restore backend/Klucz.sln --locked-mode

      # `SourceRevisionId`: SDK dokleja go do `InformationalVersion` po znaku `+`,
      # a `/health` oddaje wlasnie ta wersje. Bez tego pole `version` bylo stala
      # i nie odrozniało zadnych dwoch buildow.
      - name: Build
        run: dotnet build backend/Klucz.sln --configuration Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Testy
        run: dotnet test backend/Klucz.sln --configuration Release --no-build

  web:
    name: typecheck (zero-DOM) + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Osobne zadanie od `contract`, bo pyta o co innego: czy warstwa TS sama w sobie
    # jest zdrowa. Zero-DOM egzekwuje tu `tsc` — `packages/core` kompiluje sie bez
    # `lib: DOM`, wiec `document` w tym pakiecie nie przechodzi typecheck'u. Vitest
    # dokłada dwie pozostale warstwy: zabronione zaleznosci i skan zrodel.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Zaleznosci
        run: pnpm -C web install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C web -r typecheck

      - name: Testy
        run: pnpm -C web -r test

      # Build jest osobnym sprawdzianem: `packages/core` ma sie kompilowac SAM
      # (bez Vite i bez Reacta), a `apps/web` ma sie faktycznie zbudowac do dist.
      - name: Build
        run: pnpm -C web -r build

  contract:
    name: dryf OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Osobne zadanie, bo pyta o co innego niż testy: czy kontrakt w repozytorium
    # zgadza się z kodem. Zmieniłeś DTO i nie przegenerowałeś klienta → czerwono.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Zależności weba
        run: pnpm -C web install --frozen-lockfile

      # `--no-incremental`: MSBuild pomija cel generujacy dokument, gdy projekt jest
      # aktualny. Bez tego bramka robila `git diff` na pliku, ktorego nikt w tym
      # przebiegu nie odtworzyl — i zawsze widziala zgodnosc, takze wtedy, gdy
      # w repozytorium lezal stary kontrakt. Asercja istnienia jest osobno, bo
      # „nie wygenerowano" wyglada tak samo jak „nie ma zmian".
      - name: Bramka dryfu
        run: |
          dotnet restore backend/src/Klucz.Api/Klucz.Api.csproj --locked-mode
          dotnet build backend/src/Klucz.Api/Klucz.Api.csproj --no-restore --no-incremental
          test -f backend/artifacts/openapi.json || { echo "BRAK ARTEFAKTU: build nie wygenerowal openapi.json"; exit 1; }
          pnpm -C web --filter @klucz/api-client run generate
          test -f web/packages/api-client/src/schema.d.ts || { echo "BRAK ARTEFAKTU: generator nie wygenerowal schema.d.ts"; exit 1; }
          git diff --exit-code -- backend/artifacts/openapi.json web/packages/api-client/src/schema.d.ts

      # Bramka dryfu sprawdza, czy KONTRAKT zgadza sie z kodem — nie sprawdza, czy
      # klient dalej sie kompiluje. Zmiana nazwy DTO regenerowana i zacommitowana
      # przechodzila ja na zielono, a recznie pisany `client.ts` przestawal sie
      # kompilowac. Zadanie `web` tego nie zastapi: ono typecheck'uje schema.d.ts
      # Z REPOZYTORIUM, a tutaj plik jest swiezo wygenerowany z biezacego kodu.
      #
      # `--filter @klucz/api-client`, a nie `-r`: pytanie o dryf dotyczy wylacznie
      # klienta, a caly workspace typecheck'owal sie tu drugi raz bez nowej informacji.
      - name: Typecheck klienta
        run: pnpm -C web --filter @klucz/api-client typecheck
