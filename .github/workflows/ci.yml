# Bramka, która nie zależy od pamięci autora.
#
# Bez bazy i bez mirrora pakiet testów kurczy się z 33 do 14 — dlatego usługa
# Postgresa stoi tu obok kroków: „zielone CI" i „CI, które nic nie uruchomiło"
# mają wyglądać różnie. Liczba pominiętych testów jest wypisywana wprost.
#
# Arkusze CKE NIE wchodzą do repozytorium (G0.1), więc testy oznaczone `mirror`
# pomijają się tutaj świadomie. Regresję rekonstrukcji trzymają zamiast nich
# zrzuty stron w `ingest/tests/fixtures/`.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python:
    name: ruff + pytest + migracje
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: klucz
          POSTGRES_USER: klucz
          POSTGRES_PASSWORD: klucz_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klucz -d klucz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: klucz
      DB_USER: klucz
      DB_PASSWORD: klucz_ci
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--extra dev` bo pytest i ruff stoją w `optional-dependencies.dev`;
      # bez tego CI instalowałoby sam produkt i nie miało czym uruchomić testów.
      - name: Zależności
        working-directory: ingest
        run: uv sync --frozen --extra dev

      - name: Migracje schematu
        working-directory: ingest
        run: uv run python -m schema.migrate

      - name: Lint
        working-directory: ingest
        run: uv run ruff check .

      # `-rs` wypisuje powód każdego pominięcia. Bez tego nie widać różnicy
      # między „testy przeszły" a „testy się nie uruchomiły".
      - name: Testy
        working-directory: ingest
        run: uv run pytest -q -rs

  dotnet:
    name: build + testy backendu
    runs-on: ubuntu-latest

    # Baza stoi także tutaj: bez niej `Zywa_baza_daje_odpowiedz_ok` pomija się,
    # a health check przestaje być czymkolwiek sprawdzonym.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: klucz
          POSTGRES_USER: klucz
          POSTGRES_PASSWORD: klucz_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klucz -d klucz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: klucz
      DB_USER: klucz
      DB_PASSWORD: klucz_ci

    steps:
      - uses: actions/checkout@v4

      # Wersja SDK z `backend/global.json` — CI i maszyna budują tym samym.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Build
        run: dotnet build backend/Klucz.sln --configuration Release

      - name: Testy
        run: dotnet test backend/Klucz.sln --configuration Release --no-build

  kontrakt:
    name: dryf OpenAPI
    runs-on: ubuntu-latest

    # Osobne zadanie, bo pyta o co innego niż testy: czy kontrakt w repozytorium
    # zgadza się z kodem. Zmieniłeś DTO i nie przegenerowałeś klienta → czerwono.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Zależności weba
        run: pnpm -C web install --frozen-lockfile

      - name: Bramka dryfu
        run: |
          dotnet build backend/src/Klucz.Api/Klucz.Api.csproj
          pnpm -C web --filter @klucz/api-client run generate
          git diff --exit-code -- backend/artifacts/openapi.json web/packages/api-client/src/schema.d.ts
